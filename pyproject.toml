[project]
name = "lgt-net"
version = "0.1.0"
description = "Indoor panoramic room layout estimation with LGT-Net"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "einops==0.8.2",
    "gdown==6.1.0",
    "gradio==6.20.0",
    "imageio==2.37.3",
    "ipywidgets==8.1.8",
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "onnx==1.22.0",
    "onnxruntime-gpu==1.26.0",
    "onnxsim==0.6.5",
    "open3d==0.19.0",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pyglm==2.8.3",
    "pylsd-nova==1.2.1",
    "pyopengl==3.1.10",
    "pyqt5==5.15.11",
    "scipy==1.18.0",
    "shapely==2.1.2",
    "tensorboard==2.21.0",
    "termcolor==3.3.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm==4.68.4",
    "yacs==0.1.8",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
